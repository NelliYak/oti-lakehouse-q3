name: oti-lakehouse
services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: student
      MINIO_ROOT_PASSWORD: student-local-password
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-catalog-password
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 30
  migrate:
    image: quay.io/lakekeeper/catalog:v0.14.0
    command: migrate
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: local-study-encryption-key
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:local-catalog-password@postgres:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:local-catalog-password@postgres:5432/postgres
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__INSECURE_ALLOW_UNAUTHENTICATED: 'true'
    depends_on:
      postgres: {condition: service_healthy}
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.0
    command: serve
    environment: *lakekeeper-env
    ports: ['127.0.0.1:8181:8181']
    depends_on:
      migrate: {condition: service_completed_successfully}
  trino:
    image: trinodb/trino:476
    mem_limit: 4g
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./config/catalog:/etc/trino/catalog:ro
  spark:
    image: apache/spark:3.5.3
    mem_limit: 2g
    profiles: [tools]
    user: root
    volumes:
      - ./scripts:/opt/practice:ro
      - ./results:/opt/results
    entrypoint: ['/opt/spark/bin/spark-submit']
    command: ['--master', 'local[2]', '--jars', '/opt/practice/trino-jdbc-476.jar', '/opt/practice/spark_bronze.py']
volumes:
  minio-data:
  postgres-data:
